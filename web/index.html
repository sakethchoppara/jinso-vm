<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Playground</title>
<meta name="description" content="A bytecode compiler and stack VM written in Rust, running in your browser via WebAssembly.">
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --line: #e4e1d8; --text: #1d1c19; --muted: #6f6b61;
    --accent: #b4531f; --accent-text: #ffffff; --error: #b42318; --gutter: #a8a397;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1c1c1a; --line: #2e2d2a; --text: #ecebe6; --muted: #9c988d;
      --accent: #e0814a; --accent-text: #141413; --error: #ff8a7a; --gutter: #57544d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; padding: 20px 24px; gap: 16px;
  }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font: 600 22px/1 var(--mono); margin: 0; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); flex: 1; min-width: 240px; }
  a { color: var(--accent); }

  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  select, button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer;
  }
  button.run { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 8px 18px; }
  button.run:disabled { opacity: 0.6; cursor: progress; }
  label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  kbd { font: 12px var(--mono); color: var(--muted); }
  #status { margin-left: auto; font: 13px var(--mono); color: var(--muted); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pane-head { display: flex; border-bottom: 1px solid var(--line); font-size: 13px; }
  .pane-head span, .tab { padding: 8px 14px; color: var(--muted); }
  .tab { background: none; border: 0; border-radius: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .editor { flex: 1; min-height: 0; display: flex; font: 14px/1.6 var(--mono); }
  #gutter { margin: 0; padding: 12px 6px 12px 14px; color: var(--gutter); text-align: right; user-select: none; overflow: hidden; }
  #src {
    flex: 1; border: 0; outline: 0; resize: none; padding: 12px 14px 12px 8px; margin: 0;
    font: inherit; color: var(--text); background: transparent; white-space: pre; tab-size: 2;
  }
  #out { flex: 1; min-height: 0; margin: 0; padding: 12px 14px; overflow: auto; font: 14px/1.6 var(--mono); white-space: pre; }
  #out .err { color: var(--error); }
  #out .note { color: var(--muted); }

  @media (max-width: 760px) {
    body { padding: 16px; }
    main { grid-template-columns: 1fr; grid-auto-rows: minmax(320px, 1fr); }
    #status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>lumen</h1>
  <p>A bytecode compiler and stack-based VM written in Rust, running here as WebAssembly.</p>
  <a href="https://github.com/sakethchoppara/lumen-vm">Source on GitHub</a>
</header>

<div class="toolbar">
  <select id="examples" aria-label="Example program"></select>
  <button class="run" id="run">Run</button>
  <kbd>Ctrl+Enter</kbd>
  <label><input type="checkbox" id="stress"> GC stress (collect on every allocation)</label>
  <span id="status" role="status"></span>
</div>

<main>
  <section class="pane">
    <div class="pane-head"><span>program.lm</span></div>
    <div class="editor">
      <pre id="gutter" aria-hidden="true"></pre>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Program source"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="pane-head" role="tablist">
      <button class="tab" role="tab" data-tab="output" aria-selected="true">Output</button>
      <button class="tab" role="tab" data-tab="bytecode" aria-selected="false">Bytecode</button>
      <button class="tab" role="tab" data-tab="ast" aria-selected="false">Syntax tree</button>
    </div>
    <pre id="out" role="tabpanel" tabindex="0"></pre>
  </section>
</main>

<script>
const EXAMPLES = {
  'Recursion: fib': `// Each call gets a frame; n lives in stack slot 0.
// Open the Bytecode tab to see Call and Return.
fn fib(n) {
  if n < 2 { return n; }
  return fib(n - 1) + fib(n - 2);
}

print fib(25);
`,
  'Loops: primes': `// Primes below 50. d and prime are block locals:
// the compiler pops them at the end of every iteration.
let i = 2;
while i < 50 {
  let d = 2;
  let prime = true;
  while d * d <= i and prime {
    if i % d == 0 { prime = false; }
    d = d + 1;
  }
  if prime { print i; }
  i = i + 1;
}
`,
  'Strings and GC': `// Strings live on a garbage-collected heap. Run this, then
// tick "GC stress" to collect before every allocation and compare.
fn wrap(s) {
  return "[" + s + "]";   // builds a new string: garbage once unused
}

let s = "";
let i = 0;
while i < 3000 {
  s = s + "x";           // appends in place: no new object
  let w = wrap(s);       // a fresh copy each iteration
  i = i + 1;
}
print wrap("lumen");
print s == s;
`,
  'Closures': `// A closure keeps the variables it uses alive after
// the function that made them returns. Open the Bytecode
// tab to see Closure, GetUpvalue and SetUpvalue.
fn make_counter() {
  let count = 0;
  fn next() {
    count = count + 1;
    return count;
  }
  return next;
}

let a = make_counter();
let b = make_counter();
print a();   // 1
print a();   // 2
print b();   // 1: each call has its own count
`,
  'Arrays': `// Arrays live on the GC heap and are shared, not copied.
let grid = [[1, 2, 3], [4, 5, 6]];
let row = grid[1];
row[0] = 40;            // row and grid[1] are the same array
print grid;

let squares = [];
let i = 0;
while i < 6 { push(squares, i * i); i = i + 1; }
print squares;
print len(squares);

let me = ["self"];
push(me, me);           // a cycle prints as [...]
print me;
`,
  'Errors': `// The parser recovers after an error,
// so it reports every syntax error in one pass.
let = 1;
print (2 + ;
print 3
let ok = 4;
`,
  'Runtime error': `// Runtime errors carry the source line.
fn countdown(n) {
  return countdown(n - 1);  // never stops
}
countdown(10);
`,
};

const $ = id => document.getElementById(id);
const src = $('src'), gutter = $('gutter'), out = $('out'), status = $('status'), runBtn = $('run');
const TIMEOUT_MS = 5000;
// Unique per page load, so a cached worker.js can never pair with a newer lumen.wasm.
const WORKER_URL = `worker.js?${Date.now()}`;
let worker, timer, result = null, tab = 'output', renderQueued = false;

const sel = $('examples');
for (const name of Object.keys(EXAMPLES)) sel.add(new Option(name, name));
const custom = new Option('Custom program', '');
custom.disabled = custom.hidden = true;
sel.add(custom);
sel.onchange = () => { load(EXAMPLES[sel.value]); run(); };

function load(text) { src.value = text; syncGutter(); }

function syncGutter() {
  const n = src.value.split('\n').length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  gutter.scrollTop = src.scrollTop;
}
src.addEventListener('input', () => {
  syncGutter();
  if (src.value !== EXAMPLES[sel.value]) sel.value = '';
});
src.addEventListener('scroll', () => { gutter.scrollTop = src.scrollTop; });
src.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); document.execCommand('insertText', false, '  '); }
});
runBtn.onclick = run;
$('stress').onchange = run;

for (const t of document.querySelectorAll('.tab')) {
  t.onclick = () => {
    tab = t.dataset.tab;
    for (const o of document.querySelectorAll('.tab')) o.setAttribute('aria-selected', o === t);
    render();
  };
}

// Messages arrive as the program runs: {ast}, {bytecode}, {output} per batch of lines,
// then {error} or {gc}, then {done} (or {crash} if the VM itself failed).
function newWorker() {
  worker = new Worker(WORKER_URL);
  worker.onmessage = ({ data }) => {
    if ('output' in data) result.output += data.output;
    else if (data.crash) result.error = data.crash;
    else Object.assign(result, data);
    if (data.done || data.crash) {
      finish();
      if (data.crash) { worker.terminate(); newWorker(); }
      else status.textContent = `${data.ms < 1 ? data.ms.toFixed(2) : data.ms.toFixed(1)} ms` + (result.gc ? ` · ${result.gc}` : '');
    }
    queueRender();
  };
}

function finish() {
  clearTimeout(timer);
  runBtn.disabled = false;
  result.done = true;
  status.textContent = '';
}

function run() {
  if (runBtn.disabled) return;
  runBtn.disabled = true;
  result = { output: '' };
  status.textContent = 'running…';
  render();
  worker.postMessage({ src: src.value, stress: $('stress').checked });
  timer = setTimeout(() => {
    worker.terminate();
    newWorker();
    finish();
    result.error = `Stopped after ${TIMEOUT_MS / 1000} s. Is there a loop that never ends?`;
    render();
  }, TIMEOUT_MS);
}

// Output can arrive in many small messages; draw at most once per frame.
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function line(text, cls) {
  const s = document.createElement('span');
  s.className = cls;
  s.textContent = text;
  return s;
}

function render() {
  // Follow streaming output (and the final error) unless the reader has scrolled up.
  const atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
  out.replaceChildren();
  if (!result) return;
  if (tab === 'output') {
    out.append(result.output);
    if (result.error) out.append(line(result.error, 'err'));
    if (result.done && !result.output && !result.error) out.append(line('(no output)', 'note'));
    if (atBottom) out.scrollTop = out.scrollHeight;
  } else if (result[tab]) {
    out.append(result[tab]);
  } else if (result.done) {
    out.append(line(result.error ? 'Fix the errors to see this.' : '(empty program)', 'note'));
  }
}

newWorker();
load(EXAMPLES['Recursion: fib']);
run();
</script>
</body>
</html>
